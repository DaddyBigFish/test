<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>Source Prices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0b;
    --surface: #141414;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.20);
    --text: #f2f0ec;
    --muted: #8f8b85;
    --gold: #d0a85c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: env(safe-area-inset-bottom);
  }

  header {
    padding: 20px 16px 14px;
    max-width: 1280px;
    margin: 0 auto;
  }
  header h1 {
    font-family: 'Anton', Impact, sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    font-size: clamp(1.8rem, 7vw, 2.6rem);
    line-height: 0.95;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
  }
  .subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin: 0;
  }
  .subtitle span { color: var(--gold); }

  .controls-bar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .controls {
    max-width: 1280px;
    margin: 0 auto;
    padding: 10px 16px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .category-select, .brand-select {
    flex: 1 1 90px;
    padding: 12px 8px;
    border: 1px solid var(--border-strong);
    border-radius: 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.76rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }
  .controls input[type="search"] {
    flex: 2 1 80px;
    min-width: 0;
    padding: 12px 10px;
    border: 1px solid var(--border-strong);
    border-radius: 0;
    background: var(--surface);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    outline: none;
  }
  .controls input[type="search"]::placeholder { color: var(--muted); }

  /* Filters button in the sticky bar - opens the bottom sheet below instead
     of cramming Brand/Sort/Currency into the sticky bar itself, which was
     wrapping to 3-4 rows on a phone and eating most of the screen. */
  .filters-btn {
    position: relative;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 12px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.76rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    cursor: pointer;
  }
  .filters-btn svg { width: 15px; height: 15px; flex: none; }
  @media (max-width: 420px) {
    .filters-btn { padding: 12px 10px; }
    .filters-btn-label { display: none; }
  }
  .filters-badge {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--gold);
  }

  /* Bottom sheet: rounded top corners are the one deliberate break from this
     page's otherwise all-sharp-corners look, same reasoning as the gift-card
     modal on the storefront - it's such a strong native iOS/Android
     convention for this exact UI pattern that keeping it square would read
     as broken rather than "on brand". */
  .filter-sheet-overlay {
    position: fixed;
    inset: 0;
    z-index: 250;
    background: rgba(0,0,0,0);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    transition: background 0.25s ease;
  }
  .filter-sheet-overlay.open { background: rgba(0,0,0,0.6); }
  .filter-sheet {
    width: 100%;
    max-width: 520px;
    max-height: 80vh;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-bottom: none;
    border-radius: 16px 16px 0 0;
    padding-bottom: env(safe-area-inset-bottom);
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(.2,.9,.3,1.1);
  }
  .filter-sheet-overlay.open .filter-sheet { transform: translateY(0); }
  .filter-sheet-handle {
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: var(--border-strong);
    margin: 10px auto 4px;
  }
  .filter-sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 18px 14px;
    border-bottom: 1px solid var(--border);
  }
  .filter-sheet-header h2 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 0;
  }
  .filter-sheet-header-actions { display: flex; align-items: center; gap: 14px; }
  .filter-reset-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }
  .filter-sheet-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.2rem;
    line-height: 1;
    cursor: pointer;
    padding: 4px;
  }
  .filter-sheet-body {
    padding: 16px 18px 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .filter-field { display: flex; flex-direction: column; gap: 8px; }
  .filter-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .filter-field .brand-select { width: 100%; flex: none; }

  /* Searchable currency list: this used to be a text input with a floating
     absolutely-positioned dropdown, but that fought with the on-screen
     mobile keyboard - the keyboard eats the bottom of the viewport and the
     dropdown either ended up hidden behind it or the sheet's own scrolling
     fought with the keyboard's resize. An always-visible, normal-in-flow
     list beneath a plain search box sidesteps that entirely: there's no
     floating layer to fight the keyboard for space, it just scrolls as part
     of the sheet like anything else. */
  .currency-current {
    color: var(--gold);
    font-weight: 700;
  }
  .currency-search-input {
    width: 100%;
    padding: 12px 10px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.02em;
    outline: none;
  }
  .currency-search-input:focus { border-color: var(--gold); }
  .currency-list {
    margin-top: 8px;
    max-height: 200px;
    overflow-y: auto;
    border: 1px solid var(--border-strong);
  }
  .currency-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
  }
  .currency-option:hover { background: rgba(208,168,92,0.15); }
  .currency-option.selected {
    background: var(--gold);
    color: #171310;
  }
  .currency-option-empty {
    padding: 10px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.74rem;
    color: var(--muted);
  }

  .grid {
    max-width: 1280px;
    margin: 0 auto;
    padding: 14px 12px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
  }
  @media (min-width: 640px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; padding: 18px 20px 80px; }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    position: relative;
    opacity: 0;
    animation: cardIn 0.4s ease forwards;
    transition: border-color 0.2s, transform 0.15s;
  }
  .card:active { transform: scale(0.98); }
  @media (hover: hover) {
    .card:hover { border-color: var(--border-strong); }
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card-media {
    position: relative;
    background: #ffffff;
    cursor: zoom-in;
  }
  .card-media img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
  }
  .price-tag {
    position: absolute;
    top: 8px;
    right: 8px;
    background: var(--bg);
    border: 1px solid var(--border-strong);
    padding: 4px 7px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 0.74rem;
  }
  .zoom-hint {
    position: absolute;
    top: 8px;
    left: 8px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(11,11,11,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .zoom-hint svg { width: 12px; height: 12px; color: var(--text); }

  /* Full-screen image viewer: pinch-zoom + pan on touch (handled manually in
     JS below since we want it scoped to the image, not the whole page), and
     just a plain centered full-size image with no gesture handling on a
     mouse-driven browser - there's nothing to pinch with a cursor. */
  .image-modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 300;
    background: rgba(0,0,0,0.94);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
  }
  .image-modal-close {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    right: 14px;
    z-index: 2;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border-strong);
    background: rgba(20,20,20,0.85);
    color: var(--text);
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
  }
  .image-modal-viewport {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .image-modal-viewport img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    will-change: transform;
    user-select: none;
    -webkit-user-drag: none;
  }
  .card-body {
    padding: 10px 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }
  .card-title {
    font-size: 0.8rem;
    font-weight: 600;
    line-height: 1.25;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  .source-link {
    display: block;
    margin-top: auto;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--gold);
    text-decoration: none;
  }

  .empty, .load-more-indicator {
    max-width: 1280px;
    margin: 0 auto;
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .load-more-wrap { padding-bottom: 20px; }
</style>
</head>
<body>

<header>
  <h1 id="page-title">Source Prices</h1>
  <p class="subtitle"><span id="item-count">0</span> items</p>
</header>

<div class="controls-bar">
  <div class="controls">
    <select id="category-select" class="category-select"></select>
    <input type="search" id="search" placeholder="Search…">
    <button type="button" id="filters-btn" class="filters-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
      <span class="filters-btn-label">Filters</span>
      <span class="filters-badge" id="filters-badge" style="display:none;"></span>
    </button>
  </div>
</div>

<div class="filter-sheet-overlay" id="filter-sheet-overlay" style="display:none;">
  <div class="filter-sheet">
    <div class="filter-sheet-handle"></div>
    <div class="filter-sheet-header">
      <h2>Filters</h2>
      <div class="filter-sheet-header-actions">
        <button type="button" id="filter-reset-btn" class="filter-reset-btn">Reset</button>
        <button type="button" id="filter-sheet-close" class="filter-sheet-close" aria-label="Close">✕</button>
      </div>
    </div>
    <div class="filter-sheet-body">
      <div class="filter-field">
        <label class="filter-label" for="brand-filter">Brand</label>
        <select id="brand-filter" class="brand-select">
          <option value="">All brands</option>
        </select>
      </div>
      <div class="filter-field">
        <label class="filter-label" for="sort-select">Sort</label>
        <select id="sort-select" class="brand-select">
          <option value="price-desc">Price: High to Low</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="">Default</option>
        </select>
      </div>
      <div class="filter-field">
        <label class="filter-label" for="currency-search">Currency <span id="currency-current"></span></label>
        <input type="text" id="currency-search" class="currency-search-input" placeholder="Search currency…" autocomplete="off" inputmode="text">
        <div class="currency-list" id="currency-list"></div>
      </div>
    </div>
  </div>
</div>

<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none;">No products match your search.</div>
<div class="load-more-wrap" id="load-more-wrap" style="display:none;">
  <p class="load-more-indicator">Loading more…</p>
</div>

<div class="image-modal-overlay" id="image-modal-overlay" style="display:none;">
  <button type="button" class="image-modal-close" id="image-modal-close" aria-label="Close">✕</button>
  <div class="image-modal-viewport" id="image-modal-viewport">
    <img id="image-modal-img" src="" alt="" draggable="false">
  </div>
</div>

<script>
  // Which JSON file to load. Override with ?category=hoodies-sweaters etc.
  // repsstar/ and findsindex/ (below) are separate folders so the two
  // catalogs never collide or get confused for one another.
  const params = new URLSearchParams(location.search);
  const category = params.get('category') || 't-shirts';
  const DATA_URL = `repsstar/${category}.json`;

  let allItems = [];
  const PAGE_SIZE = 60;
  const DEFAULT_SORT = 'price-desc';
  let currentFiltered = [];
  let renderedCount = 0;

  const grid = document.getElementById('grid');
  const emptyEl = document.getElementById('empty');
  const searchEl = document.getElementById('search');
  const brandFilterEl = document.getElementById('brand-filter');
  const sortSelectEl = document.getElementById('sort-select');
  const currencySearchEl = document.getElementById('currency-search');
  const currencyListEl = document.getElementById('currency-list');
  const currencyCurrentEl = document.getElementById('currency-current');
  const loadMoreWrap = document.getElementById('load-more-wrap');
  const categorySelectEl = document.getElementById('category-select');
  const itemCountEl = document.getElementById('item-count');
  const imageModalOverlay = document.getElementById('image-modal-overlay');
  const imageModalViewport = document.getElementById('image-modal-viewport');
  const imageModalImg = document.getElementById('image-modal-img');
  const imageModalClose = document.getElementById('image-modal-close');
  const filtersBtn = document.getElementById('filters-btn');
  const filtersBadge = document.getElementById('filters-badge');
  const filterSheetOverlay = document.getElementById('filter-sheet-overlay');
  const filterSheetClose = document.getElementById('filter-sheet-close');
  const filterResetBtn = document.getElementById('filter-reset-btn');

  // Bottom sheet for Brand/Sort/Currency - kept out of the sticky bar itself
  // since cramming all of it in there wrapped to 3-4 rows on a phone. Same
  // "set display, then add the class on the next frame" two-step used here
  // as the only way to get the slide-up transition to actually play (if the
  // 'open' class were added in the same tick as display:flex, the browser
  // never gets a chance to paint the pre-transition state first).
  function openFilterSheet() {
    filterSheetOverlay.style.display = 'flex';
    requestAnimationFrame(() => filterSheetOverlay.classList.add('open'));
  }

  function closeFilterSheet() {
    filterSheetOverlay.classList.remove('open');
    setTimeout(() => { filterSheetOverlay.style.display = 'none'; }, 280);
  }

  filtersBtn.addEventListener('click', openFilterSheet);
  filterSheetClose.addEventListener('click', closeFilterSheet);
  filterSheetOverlay.addEventListener('click', (e) => {
    if (e.target === filterSheetOverlay) closeFilterSheet();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && filterSheetOverlay.style.display !== 'none') closeFilterSheet();
  });

  function updateFiltersBadge() {
    const active = !!brandFilterEl.value || sortSelectEl.value !== DEFAULT_SORT || selectedCurrency !== 'USD';
    filtersBadge.style.display = active ? 'block' : 'none';
  }

  filterResetBtn.addEventListener('click', () => {
    brandFilterEl.value = '';
    sortSelectEl.value = DEFAULT_SORT;
    selectedCurrency = 'USD';
    localStorage.removeItem(CURRENCY_STORAGE_KEY);
    currencySearchEl.value = '';
    renderCurrencyList();
    applyFilters(); // single re-render/badge-update covering all three resets above
  });

  // Full-screen image viewer. On a touchscreen this supports real pinch-zoom
  // and, once zoomed, single-finger panning - implemented by hand (rather
  // than relying on native browser pinch-zoom) so the gesture is scoped to
  // just the image instead of zooming the whole page. On a mouse-driven
  // browser there's no pinch gesture to hook into, so it's deliberately left
  // as a plain centered full-size image - nothing to wire up there.
  let imgScale = 1, imgTranslateX = 0, imgTranslateY = 0;
  let pinchStartDistance = null;
  let pinchStartMidpoint = null;
  let dragStart = null;
  let lastTapTime = 0;
  let tapCandidate = null; // set on single-touch start, cleared once it stops looking like a tap

  function applyImageTransform() {
    imageModalImg.style.transform = `translate(${imgTranslateX}px, ${imgTranslateY}px) scale(${imgScale})`;
  }

  function resetImageTransform() {
    imgScale = 1;
    imgTranslateX = 0;
    imgTranslateY = 0;
    applyImageTransform();
  }

  function touchDistance(t1, t2) {
    return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
  }
  function touchMidpoint(t1, t2) {
    return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
  }

  function openImageModal(item) {
    imageModalImg.src = item.image || '';
    imageModalImg.alt = item.product_title || '';
    resetImageTransform();
    imageModalOverlay.style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }

  function closeImageModal() {
    imageModalOverlay.style.display = 'none';
    document.body.style.overflow = '';
  }

  imageModalClose.addEventListener('click', closeImageModal);
  // The viewport fills the entire overlay (so the image can sit centered
  // anywhere within it), which means a plain background click always lands
  // on the viewport, never on the overlay itself - so this has to check
  // "anything except the image" rather than "the overlay element exactly".
  imageModalViewport.addEventListener('click', (e) => {
    if (e.target !== imageModalImg) closeImageModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && imageModalOverlay.style.display !== 'none') closeImageModal();
  });

  imageModalViewport.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      pinchStartDistance = touchDistance(e.touches[0], e.touches[1]);
      pinchStartMidpoint = touchMidpoint(e.touches[0], e.touches[1]);
      dragStart = null;
      tapCandidate = null;
    } else if (e.touches.length === 1) {
      dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, tx: imgTranslateX, ty: imgTranslateY };
      tapCandidate = { x: e.touches[0].clientX, y: e.touches[0].clientY, time: Date.now() };
    }
  }, { passive: true });

  imageModalViewport.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && pinchStartDistance != null) {
      e.preventDefault();
      tapCandidate = null;
      const newDistance = touchDistance(e.touches[0], e.touches[1]);
      const newMidpoint = touchMidpoint(e.touches[0], e.touches[1]);
      const nextScale = Math.min(Math.max(imgScale * (newDistance / pinchStartDistance), 1), 5);
      // Shift the pan by however much the pinch midpoint itself moved, so
      // the zoom tracks where the fingers actually are instead of always
      // zooming from the image's center.
      imgTranslateX += newMidpoint.x - pinchStartMidpoint.x;
      imgTranslateY += newMidpoint.y - pinchStartMidpoint.y;
      imgScale = nextScale;
      pinchStartDistance = newDistance;
      pinchStartMidpoint = newMidpoint;
      applyImageTransform();
    } else if (e.touches.length === 1 && dragStart) {
      // A real drag, not a tap, once the finger has moved more than a few
      // px - stops a pan/pinch release from being mistaken for a tap.
      if (tapCandidate && Math.hypot(e.touches[0].clientX - tapCandidate.x, e.touches[0].clientY - tapCandidate.y) > 10) {
        tapCandidate = null;
      }
      if (imgScale > 1) {
        e.preventDefault();
        imgTranslateX = dragStart.tx + (e.touches[0].clientX - dragStart.x);
        imgTranslateY = dragStart.ty + (e.touches[0].clientY - dragStart.y);
        applyImageTransform();
      }
    }
  }, { passive: false });

  imageModalViewport.addEventListener('touchend', (e) => {
    if (e.touches.length < 2) pinchStartDistance = null;
    if (e.touches.length === 0) {
      dragStart = null;
      if (imgScale <= 1) resetImageTransform();

      // Double-tap to toggle zoom, same as any native photo viewer - but
      // only counts as a "tap" if this touch was quick and didn't move
      // (tapCandidate survives touchmove only when both are true), so
      // releasing a pinch or pan right before a real tap doesn't falsely
      // chain into a double-tap toggle.
      const now = Date.now();
      const wasQuickTap = tapCandidate && (now - tapCandidate.time < 250);
      if (wasQuickTap && now - lastTapTime < 300) {
        if (imgScale > 1) {
          resetImageTransform();
        } else {
          imgScale = 2.5;
          applyImageTransform();
        }
      }
      if (wasQuickTap) lastTapTime = now;
      tapCandidate = null;
    }
  });

  // Same UK-relabeled category list used by the other two tools on this site.
  const CATEGORIES = [
    ["sneaker", "Trainers"],
    ["hoodies-sweaters", "Hoodies & Jumpers"],
    ["t-shirts", "T-Shirts"],
    ["jackets", "Jackets"],
    ["pants-shorts", "Trousers & Shorts"],
    ["headwear", "Headwear"],
    ["bags", "Bags"],
    ["accessories", "Accessories"],
    ["perfume", "Fragrance"],
    ["electronics", "Electronics"],
    ["jersey", "Sports Jerseys"],
    ["other-stuff", "Other"],
    ["sunglasses", "Sunglasses"],
    ["underwear", "Underwear"],
    ["socks", "Socks"],
    // Promoted from a same-page "Type" guess to their own category (see
    // PROMOTED_CATEGORIES in scrape_category.py) - a catch-all like "Other"
    // or "Trainers" was hiding what was actually inside it (dresses were
    // tagged but had nowhere of their own to show up).
    ["boots", "Boots"],
    ["heels-sandals", "Heels & Sandals"],
    ["loafers-formal", "Loafers & Formal Shoes"],
    ["slippers", "Slippers"],
    ["tracksuits", "Tracksuits"],
    ["sweaters-cardigans", "Jumpers & Cardigans"],
    ["polos", "Polo Shirts"],
    ["tank-tops", "Vest Tops"],
    ["long-sleeve", "Long Sleeve Tops"],
    ["button-up-shirts", "Shirts"],
    ["puffer-down", "Puffer & Down Jackets"],
    ["coats", "Coats"],
    ["denim-jackets", "Denim Jackets"],
    ["vests", "Gilets"],
    ["windbreakers", "Windbreakers"],
    ["jeans", "Jeans"],
    ["cargo-pants", "Cargo Trousers"],
    ["sweatpants-joggers", "Joggers & Sweatpants"],
    ["shorts", "Shorts"],
    ["leggings", "Leggings"],
    ["skirts", "Skirts"],
    ["beanies", "Beanies"],
    ["bucket-hats", "Bucket Hats"],
    ["caps", "Caps"],
    ["backpacks", "Backpacks"],
    ["crossbody-belt-bags", "Crossbody & Belt Bags"],
    ["totes-shoulder-bags", "Totes & Shoulder Bags"],
    ["duffle-travel", "Duffle & Travel Bags"],
    ["clutches", "Clutches"],
    ["jewelry", "Jewellery"],
    ["watches", "Watches"],
    ["belts", "Belts"],
    ["wallets-card-holders", "Wallets & Card Holders"],
    ["scarves-gloves", "Scarves & Gloves"],
    ["earbuds-headphones", "Earbuds & Headphones"],
    ["speakers", "Speakers"],
    ["smartwatches", "Smartwatches"],
    ["chargers-cables", "Chargers & Cables"],
    ["phone-accessories", "Phone Accessories"],
    ["dresses-sets", "Dresses & Sets"],
    ["suits", "Suits"],
    ["activewear", "Activewear"],
    ["optical-glasses", "Optical Glasses"],
    ["swimwear", "Swimwear"],
    ["sleepwear", "Sleepwear"],
  ];

  function renderCategorySelect(availableSlugs) {
    categorySelectEl.innerHTML = '';
    for (const [slug, label] of CATEGORIES) {
      if (availableSlugs && !availableSlugs.has(slug) && slug !== category) continue;
      const opt = document.createElement('option');
      opt.value = slug;
      opt.textContent = label;
      if (slug === category) opt.selected = true;
      categorySelectEl.appendChild(opt);
    }
  }
  renderCategorySelect();
  categorySelectEl.addEventListener('change', () => {
    location.search = `?category=${categorySelectEl.value}`;
  });

  async function fetchCategoryManifest() {
    try {
      const res = await fetch('categories.json', { cache: 'no-store' });
      if (!res.ok) return null;
      const data = await res.json();
      return new Set((data.categories || []).map(c => c.slug));
    } catch (err) {
      return null;
    }
  }

  // Currency converter: live rates (relative to USD, since price_usd is what
  // every item already carries) from open.er-api.com - free, no API key,
  // genuinely sends Access-Control-Allow-Origin: * (Frankfurter's docs claim
  // CORS support too but its responses don't actually carry the header, so
  // that one gets blocked client-side - verified both directly before
  // picking this one). Falls back to USD-only if the fetch fails so the page
  // still works with no network access to that API.
  let exchangeRates = { USD: 1 };
  const CURRENCY_STORAGE_KEY = 'source:currency';
  // Persisted in localStorage (not just a JS variable) because switching
  // category does a full page navigation, not an in-page re-render - without
  // this the currency would silently snap back to USD on every category
  // switch, which is exactly what was reported as broken.
  let selectedCurrency = localStorage.getItem(CURRENCY_STORAGE_KEY) || 'USD';
  const CURRENCY_SYMBOLS = {
    USD: '$', GBP: '£', EUR: '€', JPY: '¥', CNY: '¥', AUD: 'A$', CAD: 'C$',
    HKD: 'HK$', NZD: 'NZ$', SGD: 'S$', INR: '₹', CHF: 'CHF ',
  };

  async function fetchExchangeRates() {
    try {
      const res = await fetch('https://open.er-api.com/v6/latest/USD');
      if (!res.ok) throw new Error(res.statusText);
      const data = await res.json();
      if (data.result !== 'success' || !data.rates) throw new Error('Unexpected response shape');
      exchangeRates = { USD: 1, ...data.rates };
    } catch (err) {
      console.error('Failed to fetch exchange rates, defaulting to USD only', err);
      exchangeRates = { USD: 1 };
    }
    renderCurrencyList(); // the persisted currency might not be in the USD-only fallback set yet
  }

  function convertFromUsd(usdAmount) {
    return usdAmount * (exchangeRates[selectedCurrency] ?? 1);
  }

  function formatCurrency(amount, code) {
    const symbol = CURRENCY_SYMBOLS[code];
    return symbol ? `${symbol}${amount.toFixed(2)}` : `${code} ${amount.toFixed(2)}`;
  }

  // Currency list: always rendered in-flow inside the filter sheet (not a
  // floating/absolutely-positioned dropdown) with a plain search box above
  // it that filters live as you type. The earlier combobox-with-popup
  // version fought with the on-screen mobile keyboard - the keyboard eats
  // the bottom of the viewport, and an absolutely-positioned dropdown either
  // ended up hidden behind it or clipped by it. Because this list is just
  // normal scrollable content inside the sheet, there's no floating layer to
  // conflict with the keyboard in the first place.
  function selectCurrency(code) {
    selectedCurrency = code;
    localStorage.setItem(CURRENCY_STORAGE_KEY, code);
    currencySearchEl.value = '';
    currencySearchEl.blur(); // dismiss the on-screen keyboard now that a choice has been made
    renderCurrencyList();
    updateFiltersBadge();
    resetAndRender(currentFiltered);
  }

  function renderCurrencyList() {
    currencyCurrentEl.textContent = selectedCurrency;
    const query = currencySearchEl.value.trim().toUpperCase();
    const codes = Object.keys(exchangeRates).sort();
    const matches = query ? codes.filter(code => code.includes(query)) : codes;

    currencyListEl.innerHTML = '';
    if (!matches.length) {
      const empty = document.createElement('div');
      empty.className = 'currency-option-empty';
      empty.textContent = 'No matching currency';
      currencyListEl.appendChild(empty);
      return;
    }
    matches.forEach(code => {
      const opt = document.createElement('div');
      opt.className = 'currency-option' + (code === selectedCurrency ? ' selected' : '');
      opt.textContent = code;
      opt.addEventListener('click', () => selectCurrency(code));
      currencyListEl.appendChild(opt);
    });
  }

  currencySearchEl.addEventListener('input', renderCurrencyList);
  currencySearchEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const firstMatch = currencyListEl.querySelector('.currency-option');
      if (firstMatch) selectCurrency(firstMatch.textContent);
    } else if (e.key === 'Escape') {
      currencySearchEl.value = '';
      renderCurrencyList();
      currencySearchEl.blur();
    }
  });
  renderCurrencyList();

  // Called more than once per page load (repsstar items first, then again
  // once findsindex's items are merged in - see mergeFindsindexData()), so
  // this must clear its own previously-added <option>s each time rather than
  // appending on top of them, or every brand/type ends up listed twice.
  function populateSelectCounts(selectEl, items, field) {
    const previousValue = selectEl.value;
    while (selectEl.options.length > 1) selectEl.remove(1);

    const counts = new Map();
    items.forEach(item => {
      const v = item[field];
      if (!v) return;
      counts.set(v, (counts.get(v) || 0) + 1);
    });
    const sorted = [...counts.entries()].sort((a, b) => b[1] - a[1]);
    for (const [value, count] of sorted) {
      const opt = document.createElement('option');
      opt.value = value;
      opt.textContent = `${value} (${count})`;
      selectEl.appendChild(opt);
    }
    if ([...selectEl.options].some(o => o.value === previousValue)) {
      selectEl.value = previousValue;
    }
  }

  function populateBrandFilter(items) {
    populateSelectCounts(brandFilterEl, items, 'brand');
  }

  function resetAndRender(items) {
    grid.innerHTML = '';
    currentFiltered = items;
    renderedCount = 0;
    itemCountEl.textContent = items.length;
    emptyEl.style.display = items.length ? 'none' : 'block';
    renderNextPage();
  }

  function renderNextPage() {
    const nextItems = currentFiltered.slice(renderedCount, renderedCount + PAGE_SIZE);
    renderCards(nextItems, renderedCount);
    renderedCount += nextItems.length;
    loadMoreWrap.style.display = renderedCount < currentFiltered.length ? 'block' : 'none';
  }

  // Auto-load the next page as the "Loading more…" indicator scrolls into
  // view - same pattern as the other two tools on this site, no click needed.
  const loadMoreObserver = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting && renderedCount < currentFiltered.length) {
      renderNextPage();
    }
  }, { rootMargin: '600px 0px' });
  loadMoreObserver.observe(loadMoreWrap);

  function renderCards(items) {
    items.forEach((item, i) => {
      // A plain div now, not a link - tapping the image opens the full-screen
      // zoom viewer, and only the "View Source" text is an actual link out to
      // repsstar, so the two actions don't fight over the same tap target.
      const card = document.createElement('div');
      card.className = 'card';
      card.style.animationDelay = `${Math.min(i, 12) * 30}ms`;

      const media = document.createElement('div');
      media.className = 'card-media';
      const img = document.createElement('img');
      img.src = item.image || '';
      img.alt = item.product_title || '';
      img.loading = 'lazy';
      img.referrerPolicy = 'no-referrer';
      img.onerror = () => { img.style.display = 'none'; };
      media.appendChild(img);
      media.addEventListener('click', () => openImageModal(item));

      const zoomHint = document.createElement('div');
      zoomHint.className = 'zoom-hint';
      zoomHint.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path><path d="M11 8v6"></path><path d="M8 11h6"></path></svg>';
      media.appendChild(zoomHint);

      if (item.price_usd != null) {
        const priceTag = document.createElement('div');
        priceTag.className = 'price-tag';
        priceTag.textContent = formatCurrency(convertFromUsd(item.price_usd), selectedCurrency);
        media.appendChild(priceTag);
      }
      card.appendChild(media);

      const body = document.createElement('div');
      body.className = 'card-body';

      const title = document.createElement('div');
      title.className = 'card-title';
      title.textContent = item.product_title || 'Untitled';
      body.appendChild(title);

      const meta = document.createElement('div');
      meta.className = 'card-meta';
      const bits = [];
      if (item.brand) bits.push(item.brand);
      if (item.price_cny != null) bits.push(`¥${item.price_cny}`);
      meta.textContent = bits.join(' · ');
      body.appendChild(meta);

      const sourceLink = document.createElement('a');
      sourceLink.className = 'source-link';
      sourceLink.href = item.product_url || '#';
      sourceLink.target = '_blank';
      sourceLink.rel = 'noopener noreferrer';
      sourceLink.textContent = 'View Source ↗';
      body.appendChild(sourceLink);

      card.appendChild(body);
      grid.appendChild(card);
    });
  }

  function applyFilters() {
    const q = searchEl.value.trim().toLowerCase();
    const brand = brandFilterEl.value;
    const sort = sortSelectEl.value;
    const filtered = allItems.filter(item => {
      const matchesQuery = !q || (item.product_title || '').toLowerCase().includes(q);
      const matchesBrand = !brand || item.brand === brand;
      return matchesQuery && matchesBrand;
    });
    // Sorting by the raw USD price is equivalent to sorting by the
    // currently-displayed converted currency (conversion is just a positive
    // scale factor), so there's no need to convert before comparing.
    if (sort === 'price-asc') {
      filtered.sort((a, b) => (a.price_usd ?? 0) - (b.price_usd ?? 0));
    } else if (sort === 'price-desc') {
      filtered.sort((a, b) => (b.price_usd ?? 0) - (a.price_usd ?? 0));
    }
    updateFiltersBadge();
    resetAndRender(filtered);
  }

  searchEl.addEventListener('input', applyFilters);
  brandFilterEl.addEventListener('change', applyFilters);
  sortSelectEl.addEventListener('change', applyFilters);

  // Independent of the item-data fetch below (like the other pages' currency
  // detection) so a slow/failed rates fetch never blocks the product grid -
  // items just render in USD until (if) more currencies become available.
  fetchExchangeRates();

  // findsindex.com's catalog (see conversation) - kept in its own findsindex/
  // subdirectory rather than merged into the repsstar t-shirts.json etc. on
  // disk, since those files are also read by the admin tool and the public
  // storefront and this data is repsstar-scale-or-bigger per category (e.g.
  // 85k t-shirts vs repsstar's ~12k) - merging on disk would have silently
  // ballooned every page that reads those files, not just this one. Fetched
  // and merged in client-side, after the repsstar render, so this page's
  // first paint isn't blocked on a second multi-ten-MB download - the grid
  // and item count just grow once it's in.
  const FINDSINDEX_DATA_URL = `findsindex/${category}.json`;

  function mergeFindsindexData(data) {
    const extra = data.items || [];
    if (!extra.length) return;
    allItems = allItems.concat(extra);
    populateBrandFilter(allItems); // re-derive: findsindex introduces brands repsstar's data doesn't have
    applyFilters();
  }

  // Some categories (mostly the ones promoted from a subcategory guess - see
  // PROMOTED_CATEGORIES in scrape_category.py) are findsindex-only, e.g.
  // dresses-sets has zero repsstar items - repsstar/dresses-sets.json simply
  // doesn't exist on disk for those. A 404 there just means "nothing from
  // this source", not a real failure, so it resolves to an empty item list
  // instead of rejecting - otherwise the whole page would show a load error
  // for any findsindex-only category before ever trying the findsindex fetch.
  Promise.all([
    fetch(DATA_URL).then(res => res.ok ? res.json() : { items: [] }),
    fetchCategoryManifest(),
  ])
    .then(([data, availableSlugs]) => {
      allItems = data.items || [];
      const categoryLabel = (CATEGORIES.find(([slug]) => slug === category) || [null, category])[1];
      document.getElementById('page-title').textContent = categoryLabel;
      document.title = `Source Prices — ${categoryLabel}`;
      renderCategorySelect(availableSlugs);
      populateBrandFilter(allItems);
      applyFilters(); // not resetAndRender(allItems) directly - this also applies the default High to Low sort

      fetch(FINDSINDEX_DATA_URL)
        .then(res => res.ok ? res.json() : null)
        .then(fsiData => { if (fsiData) mergeFindsindexData(fsiData); })
        .catch(err => console.error(`Failed to load ${FINDSINDEX_DATA_URL}`, err));
    })
    .catch(err => {
      console.error(`Failed to load ${DATA_URL}`, err);
      emptyEl.textContent = `Failed to load products: ${err.message}`;
      emptyEl.style.display = 'block';
    });
</script>

</body>
</html>
